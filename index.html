<style>
  :root{

    --paper:#F4F7F5;

    --teal-900:#0E3E3B;

    --teal-500:#1F9188;
    --teal-100:#DCEFEA;
    --amber:#E7A335;
    --amber-100:#FBEBD0;
    --coral:#D9634E;
    --coral-100:#FBE2DC;
    --line:#D8E2DE;

    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, #E4F1EC 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #FBEBD0 0%, transparent 55%),

    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  [dir="rtl"] body{direction:rtl;}
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em;}
  .lang-zh h1,.lang-zh h2,.lang-zh h3,.lang-zh .display{font-family:'Noto Sans SC',sans-serif;}
  .lang-ja h1,.lang-ja h2,.lang-ja h3,.lang-ja .display{font-family:'Noto Sans JP',sans-serif;}
  .lang-hi h1,.lang-hi h2,.lang-hi h3,.lang-hi .display{font-family:'Noto Sans Devanagari',sans-serif;}
  .lang-ar h1,.lang-ar h2,.lang-ar h3,.lang-ar .display{font-family:'Noto Sans Arabic',sans-serif;}
  .lang-zh body,.lang-zh{font-family:'Noto Sans SC',sans-serif;}
  .lang-ja{font-family:'Noto Sans JP',sans-serif;}
  .lang-hi{font-family:'Noto Sans Devanagari',sans-serif;}
  .lang-ar{font-family:'Noto Sans Arabic',sans-serif;}

  .shell{width:100%;max-width:760px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(155deg,var(--teal-700),var(--teal-900));
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;color:var(--teal-900);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:34px 32px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--teal-500),var(--amber));
  }
  @media (max-width:600px){ .card{padding:24px 18px;} }

  .lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px;}
  @media (min-width:480px){ .lang-grid{grid-template-columns:repeat(3,1fr);} }
  .lang-btn{
    border:1px solid var(--line); background:var(--paper); border-radius:12px;
    padding:12px 10px; font-size:.92rem; cursor:pointer; text-align:center;
    transition:.15s ease; color:var(--ink); font-weight:500;
  }
  .lang-btn:hover{border-color:var(--teal-500); background:var(--teal-100); transform:translateY(-1px);}

  .eyebrow{
    text-transform:uppercase; letter-spacing:.14em; font-size:.72rem;
    color:var(--teal-700); font-weight:700; margin-bottom:8px;
  }
  h1.display{font-size:1.7rem; margin:0 0 10px; color:var(--teal-900); line-height:1.2;}
  .sub{color:#4B5F5C; font-size:.98rem; line-height:1.55; margin:0 0 22px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--teal-700); color:#fff; border:none; border-radius:12px;
    padding:13px 22px; font-size:.98rem; font-weight:600; cursor:pointer;
    transition:.15s ease; font-family:inherit;
  }
  .btn:hover{background:var(--teal-900);}
  .btn.secondary{background:transparent; color:var(--teal-700); border:1.5px solid var(--teal-500);}
  .btn.secondary:hover{background:var(--teal-100);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .row-actions{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap;}

  .symptom-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:18px 0 6px;}
  @media (max-width:520px){ .symptom-grid{grid-template-columns:1fr;} }
  .symptom-chip{
    display:flex; align-items:center; gap:10px; border:1.5px solid var(--line);

    background:#fff; transition:.12s ease; font-size:.92rem;

  .symptom-chip input{accent-color:var(--teal-700); width:16px; height:16px; flex-shrink:0;}

  .progress-wrap{margin-bottom:22px;}
  .progress-track{height:6px; border-radius:4px; background:var(--line); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--teal-500),var(--teal-700)); transition:width .3s ease;}
  .progress-label{font-size:.78rem; color:#61756F; margin-top:8px; font-weight:600; letter-spacing:.02em;}

  .yn-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:12px;
    padding:16px; font-size:1rem; font-weight:700; cursor:pointer; transition:.12s ease;
    font-family:inherit;
  }
  .yn-btn.yes:hover{border-color:var(--teal-600,#166A63); background:var(--teal-100); color:var(--teal-900);}
  .yn-btn.no:hover{border-color:var(--coral); background:var(--coral-100); color:#8B3524;}

    border:1.5px solid #EFB3A4; color:#7A2E1D; border-radius:14px; padding:16px 18px; margin-bottom:22px;

  .emergency-banner b{display:block; margin-bottom:3px; font-size:.95rem;}
  .emergency-banner p{margin:0; font-size:.87rem; line-height:1.5;}

    border:1.5px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px;
    background:#fff; position:relative;

  .result-name{font-family:'Fraunces',serif; font-weight:600; font-size:1.12rem; color:var(--teal-900);}
  .result-pct{font-weight:700; font-size:1.15rem; color:var(--teal-700); white-space:nowrap;}
  .pct-track{height:8px; border-radius:5px; background:var(--line); overflow:hidden; margin:8px 0 12px;}
  .pct-fill{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--amber),var(--teal-700));}
  .result-advice{font-size:.9rem; color:#3D4F4B; line-height:1.55; margin-bottom:10px;}

    display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:600;
    background:var(--teal-100); color:var(--teal-900); padding:6px 11px; border-radius:20px;

    font-size:.78rem; padding:3px 10px; border-radius:20px; margin-bottom:12px;
  }

</head>

// max possible score per disease (symptom weights + positive question weights)

  const max = {};
  DISEASE_IDS.forEach(d=>{
    let s = 0;

    Object.values(QUESTIONS).forEach(q=>{ if(q.w[d] && q.w[d]>0) s += q.w[d]; });
    max[d] = s || 1;
  });
  return max;
}

  resultsSub:"あなたの回答に基づく、最も可能性の高い候補と次にすべきことです。",
  matchLabel:"推定一致度", adviceLabel:"対処法", specialistLabel:"受診をおすすめする科：", findDoctorTitle:"近くの医師を探す",
  findDoctorText:"Googleマップを開いて、近くの専門医を探します。", findDoctorBtn:"近くの医師を探す",
  restartBtn:"最初からやり直す", disclaimer:"SymptomSenseは教育目的のツールであり、医学的診断を提供するものではありません。結果は情報提供のための推定に過ぎず、専門的な医療アドバイスの代わりにはなりません。必ず有資格の医師にご相談ください。",
  emergencyTitle:"至急受診してください", emergencyText:"一部の症状は救急対応が必要な状態を示している可能性があります。激しい胸の痛みや呼吸困難がある場合は、直ちに救急サービスに連絡してください。",
  noSymptoms:"続行するには少なくとも1つの症状を選択してください。", selectLangTitle:"言語を選択してください", of:"/", question:"質問"},
  symptoms:{fever:"発熱",cough:"咳",sore_throat:"喉の痛み",headache:"頭痛",fatigue:"倦怠感",body_ache:"体の痛み",nausea:"吐き気",vomiting:"嘔吐",diarrhea:"下痢",chest_pain:"胸痛",breath_short:"息切れ",dizziness:"めまい",rash:"発疹",joint_pain:"関節痛",abdominal_pain:"腹痛",runny_nose:"鼻水",loss_appetite:"食欲不振",chills:"悪寒",sweating:"多汗",blurred_vision:"かすみ目",burning_urination:"排尿時の痛み"},
  diseases:{cold:{name:"風邪",advice:"休息と水分補給を行い、市販薬で症状を和らげてください。症状が悪化するか10日以上続く場合は受診してください。"},
  flu:{name:"インフルエンザ",advice:"休息し水分を取り、早期であれば抗ウイルス薬を検討してください。呼吸困難がある場合は受診してください。"},
  covid:{name:"COVID-19様疾患",advice:"他者から隔離し、休息して検査を受けてください。息切れや胸痛がある場合は直ちに受診してください。"},
  migraine:{name:"片頭痛",advice:"暗く静かな部屋で休息し、水分を取り、市販の鎮痛剤を検討してください。頻繁な場合は神経内科を受診してください。"},
  gastro:{name:"胃腸炎",advice:"経口補水液を摂取し、消化の良い食事を取ってください。激しい痛みや血便がある場合は受診してください。"},
  allergy:{name:"季節性アレルギー",advice:"抗ヒスタミン薬を試し、既知の原因を避けてください。症状が続く場合はアレルギー専門医を受診してください。"},
  bronchitis:{name:"気管支炎",advice:"休息し水分を取り、加湿器を使用してください。高熱や呼吸困難がある場合は受診してください。"},
  uti:{name:"尿路感染症",advice:"水分を十分に取り、早めに受診してください — 通常抗生物質が必要です。"},
  tension_headache:{name:"緊張型頭痛",advice:"休息しストレスを管理し、水分を取ってください。頭痛が頻繁になる場合は受診してください。"},
  food_poison:{name:"食中毒",advice:"水分を取り休息し、嘔吐が治まるまで固形物を避けてください。血便や高熱がある場合は受診してください。"}},
  specialists:{general_physician:"一般内科医",neurologist:"神経内科医",gastroenterologist:"消化器科医",allergist:"アレルギー科医 / 免疫科医",pulmonologist:"呼吸器科医",urologist:"泌尿器科医"},
  questions:{q1:"熱は急に始まり急速に上昇しましたか（38.3°C以上）？",q2:"味覚または嗅覚の喪失に気づきましたか？",q3:"咳は痰のない乾いた咳ですか？",q4:"咳は粘り気のある痰を伴いますか？",q5:"光や音で頭痛が悪化しますか？",q6:"頭痛は徐々に始まり、圧迫感のように感じますか？",q7:"過去24時間以内に普段と違う、あるいは傷んでいるかもしれない食べ物を食べましたか？",q8:"症状は食事の数時間以内に始まりましたか？",q9:"排尿時に灼熱感がありますか？",q10:"普段より頻繁に排尿する必要がありますか？",q11:"花粉、ほこり、ペットの近くで症状が悪化しますか？",q12:"鼻水は黄色や緑色ではなく透明ですか？",q13:"症状は10日以上続いていますか？",q14:"深呼吸すると胸に痛みや圧迫感を感じますか？",q15:"最近、感染症と診断された人と密接に接触しましたか？"}
}
};

/* ======================= STATE ======================= */
let state = {
  lang: null,
  screen: 'lang', // lang -> welcome -> symptoms -> questions -> results
  selectedSymptoms: new Set(),
  activeQuestions: [],
  qIndex: 0,
  answers: {} // qid -> true/false
};

function t(){ return T[state.lang]; }

/* ======================= RENDER ======================= */
const root = document.getElementById('cardRoot');
const htmlRoot = document.getElementById('htmlRoot');

function setLang(code){
  state.lang = code;
  htmlRoot.setAttribute('lang', code);
  htmlRoot.setAttribute('dir', RTL_LANGS.includes(code) ? 'rtl' : 'ltr');
  htmlRoot.className = 'lang-' + code;
  state.screen = 'welcome';
  render();
}

function render(){
  root.innerHTML = '';
  if(state.screen === 'lang') return renderLangScreen();
  if(state.screen === 'welcome') return renderWelcome();
  if(state.screen === 'symptoms') return renderSymptoms();
  if(state.screen === 'questions') return renderQuestions();
  if(state.screen === 'results') return renderResults();
}

function renderLangScreen(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="eyebrow">SymptomSense</div>
    <h1 class="display">Choose your language</h1>
    <p class="sub">Select a language to continue / Sélectionnez une langue / 选择您的语言</p>
    <div class="lang-grid" id="langGrid"></div>
  `;
  root.appendChild(wrap);
  const grid = wrap.querySelector('#langGrid');
  LANGS.forEach(l=>{
    const b = document.createElement('button');
    b.className = 'lang-btn';
    b.textContent = l.native;
    b.onclick = ()=> setLang(l.code);
    grid.appendChild(b);
  });
}

function renderTopBar(showLangSwitch){
  const bar = document.createElement('div');
  bar.className = 'top-bar';
  const left = document.createElement('div');
  left.className = 'brand-name';
  left.style.fontSize = '.8rem';
  left.style.opacity = '.6';
  left.textContent = '';
  bar.appendChild(left);
  if(showLangSwitch){
    const sel = document.createElement('select');
    sel.className = 'lang-select';
    LANGS.forEach(l=>{
      const opt = document.createElement('option');
      opt.value = l.code; opt.textContent = l.native;
      if(l.code === state.lang) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.onchange = e => { const cur = state.screen; setLang(e.target.value); state.screen = cur; render(); };
    bar.appendChild(sel);
  }
  return bar;
}

function renderWelcome(){
  const ui = t().ui;
  const wrap = document.createElement('div');
  wrap.appendChild(renderTopBar(true));
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="eyebrow">SymptomSense</div>
    <h1 class="display">${ui.title}</h1>
    <p class="sub">${ui.subtitle}</p>
  `;
  wrap.appendChild(body);
  const actions = document.createElement('div');
  actions.className = 'row-actions';
  const startBtn = document.createElement('button');
  startBtn.className = 'btn';
  startBtn.textContent = ui.startBtn;
  startBtn.onclick = ()=>{ state.screen = 'symptoms'; render(); };
  actions.appendChild(startBtn);
  wrap.appendChild(actions);
  root.appendChild(wrap);
}

function renderSymptoms(){
  const ui = t().ui; const sym = t().symptoms;
  const wrap = document.createElement('div');
  wrap.appendChild(renderTopBar(true));
  wrap.insertAdjacentHTML('beforeend', `
    <div class="eyebrow">${ui.questionsTitle ? '' : ''}Step 1</div>
    <h1 class="display" style="font-size:1.35rem">${ui.symptomsTitle}</h1>
    <p class="sub">${ui.symptomsSub}</p>
  `);
  const grid = document.createElement('div');
  grid.className = 'symptom-grid';
  SYMPTOM_IDS.forEach(id=>{
    const chip = document.createElement('label');
    chip.className = 'symptom-chip' + (state.selectedSymptoms.has(id) ? ' checked' : '');
    chip.innerHTML = `<input type="checkbox" ${state.selectedSymptoms.has(id)?'checked':''}/><span>${sym[id]}</span>`;
    const input = chip.querySelector('input');
    input.onchange = ()=>{
      if(input.checked) state.selectedSymptoms.add(id); else state.selectedSymptoms.delete(id);
      chip.classList.toggle('checked', input.checked);
    };
    grid.appendChild(chip);
  });
  wrap.appendChild(grid);

  const warn = document.createElement('p');
  warn.style.cssText = 'color:#B14A34;font-size:.82rem;margin-top:10px;display:none;';
  warn.textContent = ui.noSymptoms;
  wrap.appendChild(warn);

  const actions = document.createElement('div');
  actions.className = 'row-actions';
  const back = document.createElement('button');
  back.className = 'btn secondary'; back.textContent = ui.backBtn;
  back.onclick = ()=>{ state.screen = 'welcome'; render(); };
  const cont = document.createElement('button');
  cont.className = 'btn'; cont.textContent = ui.continueBtn;
  cont.onclick = ()=>{
    if(state.selectedSymptoms.size === 0){ warn.style.display='block'; return; }
    prepareQuestions();
    state.screen = 'questions'; state.qIndex = 0;
    render();
  };
  actions.appendChild(back); actions.appendChild(cont);
  wrap.appendChild(actions);
  root.appendChild(wrap);
}

function computeInitialScores(){
  const scores = {};
  DISEASE_IDS.forEach(d=>{
    let s = 0;
    const map = DISEASE_SYMPTOMS[d];
    state.selectedSymptoms.forEach(symId=>{ if(map[symId]) s += map[symId]; });
    scores[d] = s;
  });
  return scores;
}

function prepareQuestions(){
  const scores = computeInitialScores();
  const ranked = DISEASE_IDS.slice().sort((a,b)=> scores[b]-scores[a]);
  const topDiseases = ranked.slice(0,4).filter(d=> scores[d] > 0);
  const fallback = topDiseases.length ? topDiseases : ranked.slice(0,3);

  const allQIds = Object.keys(QUESTIONS);
  const relevant = allQIds.filter(qid => Object.keys(QUESTIONS[qid].w).some(d=> fallback.includes(d)));
  const rest = allQIds.filter(qid => !relevant.includes(qid));
  let chosen = relevant.slice(0,10);
  if(chosen.length < 10){ chosen = chosen.concat(rest.slice(0, 10-chosen.length)); }
  state.activeQuestions = chosen.slice(0,10);
  state.answers = {};
}

function renderQuestions(){
  const ui = t().ui; const qs = t().questions;
  const wrap = document.createElement('div');
  wrap.appendChild(renderTopBar(false));

  const qid = state.activeQuestions[state.qIndex];
  const progressPct = Math.round((state.qIndex) / state.activeQuestions.length * 100);

  wrap.insertAdjacentHTML('beforeend', `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="progress-label">${ui.question} ${state.qIndex+1} ${ui.of} ${state.activeQuestions.length}</div>
    </div>
    <div class="q-text">${qs[qid]}</div>
  `);

  const ynRow = document.createElement('div');
  ynRow.className = 'yn-row';
  const yesBtn = document.createElement('button');
  yesBtn.className = 'yn-btn yes'; yesBtn.textContent = ui.yes;
  yesBtn.onclick = ()=> answerQuestion(qid, true);
  const noBtn = document.createElement('button');
  noBtn.className = 'yn-btn no'; noBtn.textContent = ui.no;
  noBtn.onclick = ()=> answerQuestion(qid, false);
  ynRow.appendChild(yesBtn); ynRow.appendChild(noBtn);
  wrap.appendChild(ynRow);

  if(state.qIndex > 0){
    const actions = document.createElement('div');
    actions.className = 'row-actions';
    const back = document.createElement('button');
    back.className = 'btn secondary'; back.textContent = ui.backBtn;
    back.onclick = ()=>{ state.qIndex--; render(); };
    actions.appendChild(back);
    wrap.appendChild(actions);
  }
  root.appendChild(wrap);
}

function answerQuestion(qid, val){
  state.answers[qid] = val;
  if(state.qIndex < state.activeQuestions.length - 1){
    state.qIndex++;
  } else {
    state.screen = 'results';
  }
  render();
}

function computeFinalResults(){
  const scores = computeInitialScores();
  Object.keys(state.answers).forEach(qid=>{
    if(state.answers[qid]){
      const w = QUESTIONS[qid].w;
      Object.keys(w).forEach(d=>{ scores[d] = (scores[d]||0) + w[d]; });
    }
  });
  const results = DISEASE_IDS.map(d=>{
    const pct = Math.max(3, Math.min(97, Math.round(Math.max(scores[d],0) / MAX_SCORES[d] * 100)));
    return {id:d, pct, score:scores[d]};
  }).sort((a,b)=> b.pct - a.pct);
  return results.slice(0,4);
}

function isEmergency(){
  const s = state.selectedSymptoms;
  if(s.has('chest_pain') && s.has('breath_short')) return true;
  if(s.has('breath_short') && s.has('blurred_vision')) return true;
  if(s.has('chest_pain') && s.has('sweating')) return true;
  return false;
}

function renderResults(){
  const ui = t().ui; const dz = t().diseases; const sp = t().specialists;
  const wrap = document.createElement('div');
  wrap.appendChild(renderTopBar(true));

  wrap.insertAdjacentHTML('beforeend', `
    <div class="eyebrow">Results</div>
    <h1 class="display" style="font-size:1.4rem">${ui.resultsTitle}</h1>
    <p class="sub">${ui.resultsSub}</p>
  `);

  if(isEmergency()){
    const banner = document.createElement('div');
    banner.className = 'emergency-banner';
    banner.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 16.5h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="#B14A34" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <div><b>${ui.emergencyTitle}</b><p>${ui.emergencyText}</p></div>`;
    wrap.appendChild(banner);
  }

  const results = computeFinalResults();
  results.forEach((r,i)=>{
    const d = dz[r.id];
    const card = document.createElement('div');
    card.className = 'result-card' + (i===0 ? ' top' : '');
    card.innerHTML = `
      <div class="result-head">
        <div class="result-name">${i===0?'★ ':''}${d.name}</div>
        <div class="result-pct">${r.pct}%</div>
      </div>
      <div class="pct-track"><div class="pct-fill" style="width:${r.pct}%"></div></div>
      <div class="result-advice">${d.advice}</div>
      <div class="specialist-tag">🩺 ${ui.specialistLabel} ${sp[DISEASE_SPECIALIST[r.id]]}</div>
    `;
    wrap.appendChild(card);
  });

  const topSpecialist = sp[DISEASE_SPECIALIST[results[0].id]];
  const mapsCta = document.createElement('div');
  mapsCta.className = 'maps-cta';
  mapsCta.innerHTML = `
    <div>
      <div style="font-weight:700;font-family:'Fraunces',serif;margin-bottom:4px;">${ui.findDoctorTitle}</div>
      <p>${ui.findDoctorText}</p>
    </div>
  `;
  const mapsBtn = document.createElement('button');
  mapsBtn.className = 'btn';
  mapsBtn.textContent = ui.findDoctorBtn;
  mapsBtn.onclick = ()=> openMaps(topSpecialist);
  mapsCta.appendChild(mapsBtn);
  wrap.appendChild(mapsCta);

  const disclaimer = document.createElement('div');
  disclaimer.className = 'disclaimer';
  disclaimer.textContent = ui.disclaimer;
  wrap.appendChild(disclaimer);

  const actions = document.createElement('div');
  actions.className = 'row-actions';
  const restart = document.createElement('button');
  restart.className = 'btn secondary'; restart.textContent = ui.restartBtn;
  restart.onclick = ()=>{
    state.selectedSymptoms = new Set(); state.answers = {}; state.activeQuestions = []; state.qIndex = 0;
    state.screen = 'welcome'; render();
  };
  actions.appendChild(restart);
  wrap.appendChild(actions);

  root.appendChild(wrap);
}

function openMaps(specialistLabel){
  const query = encodeURIComponent(specialistLabel + ' near me');
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude, longitude} = pos.coords;
        window.open(`https://www.google.com/maps/search/?api=1&query=${query}&center=${latitude},${longitude}`, '_blank');
      },
      ()=>{ window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank'); },
      {timeout:5000}
    );
  } else {
    window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
  }
}

render();
</script>
